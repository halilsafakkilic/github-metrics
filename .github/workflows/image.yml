# Builds the metrics docker image once and publishes it to ghcr.io,
# so the profile workflow pulls it instead of rebuilding it every run
name: Publish image

on:
  push:
    branches: [ latest ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compute image tag
        id: tag
        run: |
          VERSION=$(grep -Po '(?<="version": ").*(?=")' package.json)
          echo "tag=v$(echo $VERSION | sed -r 's/^([0-9]+[.][0-9]+).*/\1/')" >> $GITHUB_OUTPUT
      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/halilsafakkilic/metrics:${{ steps.tag.outputs.tag }}
            ghcr.io/halilsafakkilic/metrics:latest
          labels: |
            org.opencontainers.image.source=https://github.com/halilsafakkilic/github-metrics
